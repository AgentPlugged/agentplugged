# Generated by agentplugged (setup-ci) from the method's template: yours to edit.
# agentplugged never writes over it. Each job is one check of the pull request: a failed check
# sends the story back to its agent (`npx agentplugged story ci <id>`).
# The actions are pinned by tag (`@v4`). For a stronger supply chain, pin each one by its full
# commit SHA instead (`actions/checkout@<sha> # v4`) and let a bot keep them up to date.
{{header}}
name: CI

on:
  pull_request:
  push:
    branches: [{{main_branch}}]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: {{runs_on}}
    timeout-minutes: 15
    steps:
      {{setup}}
      {{lint}}

  test:
    name: test
    runs-on: {{runs_on}}
    timeout-minutes: 30
    steps:
      {{setup}}
      {{test}}

  build:
    name: build
    runs-on: {{runs_on}}
    timeout-minutes: 15
    steps:
      {{setup}}
      {{build}}

  audit:
    name: audit
    runs-on: {{runs_on}}
    timeout-minutes: 10
    steps:
      {{setup}}
      {{audit}}
