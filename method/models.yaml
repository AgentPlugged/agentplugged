# Model of each tier, for each AI tool. Values verified on 2026-10-02.
#
# `init` copies this table into `.agentplugged/models.yaml`, and `sync` writes the model of each
# agent's tier into its generated files. To change a value for one product, do not edit the copy:
# add it to the `models` section of `.agentplugged/method.yaml`, tool by tool and tier by tier,
# for example:
#
#   models:
#     codex:
#       code:
#         model: gpt-6.2-sol
#
# Tiers: reasoning (strong reasoning), code, fast, multimodal.
# `effort` sets the reasoning effort where the tool has one per agent: `effort` for Claude Code
# (low, medium, high, xhigh, max), `model_reasoning_effort` for Codex (minimal, low, medium, high,
# xhigh, max, ultra). In `method.yaml`, `effort: none` removes it. `inherit` keeps the model of
# the session: sync reports it as a fallback.

claude-code:
  reasoning:
    model: opus
    effort: high
  code:
    model: sonnet
  fast:
    model: haiku
  multimodal:
    model: sonnet

# Codex and Cursor keep the model of the session by default: a free account refuses
# a named model ("not supported when using Codex with a ChatGPT account"), and the model of a
# sub-agent cannot be replaced once its profile names one. To name one, use the `models` section
# of `method.yaml` (for Codex, for example `gpt-6.1-sol` with `effort: medium` for `code`).
codex:
  reasoning:
    model: inherit
  code:
    model: inherit
  fast:
    model: inherit
  multimodal:
    model: inherit

antigravity:
  reasoning:
    model: pro
  code:
    model: flash
  fast:
    model: flash
  multimodal:
    model: pro

# Gemini CLI, the predecessor of Antigravity CLI, for older installations.
gemini-cli:
  reasoning:
    model: inherit
  code:
    model: inherit
  fast:
    model: inherit
  multimodal:
    model: inherit

cursor:
  reasoning:
    model: inherit
  code:
    model: inherit
  fast:
    model: inherit
  multimodal:
    model: inherit
